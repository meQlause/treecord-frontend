server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
  add_header X-Content-Type-Options nosniff;

  # built files have a hash in their name: cache them for good
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # the service worker and the page change with every release
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # the landing lives on its own Cloud Run service; it is shown here under /landings/. Its build uses relative
  # paths (vite base './'), so /landings/assets/... reaches the landing's /assets/... through this proxy.
  location = /landings {
    # relative: behind Cloud Run, nginx's own host and port (8080) are not the visitor's
    absolute_redirect off;
    return 301 /landings/;
  }

  location /landings/ {
    proxy_pass https://treecord-landing-631130167814.asia-southeast1.run.app/;
    proxy_set_header Host treecord-landing-631130167814.asia-southeast1.run.app;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # a single-page app: every route the router knows is index.html
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    try_files $uri $uri/ /index.html;
  }
}
