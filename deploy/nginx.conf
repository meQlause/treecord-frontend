server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
  add_header X-Content-Type-Options nosniff;

  # built files have a hash in their name: cache them for good
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # the service worker and the page change with every release
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # a single-page app: every route the router knows is index.html
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    try_files $uri $uri/ /index.html;
  }
}
